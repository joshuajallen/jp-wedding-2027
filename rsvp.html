<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Gate: run before any content/CSS/fonts load so there is no flash of
    // unauthenticated content, even on slow mobile connections.
    (function () {
      var page = window.location.pathname.split("/").pop() || "index.html";
      if (page !== "landing.html" && sessionStorage.getItem("wedding_authenticated") !== "true") {
        window.location.replace("landing.html");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP &middot; Prerna &amp; Josh</title>
  <meta name="description" content="RSVP for Prerna & Josh's wedding in Kenya, June 2027." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" /></noscript>
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main">

    <!-- MODULE: RSVP hero + dominant link -->
    <section class="hero">
      <div class="hero__inner container">
        <span class="eyebrow">RSVP</span>
        <h1 class="hero__names">Will you join us?</h1>
        <p class="hero__date">June 12&ndash;15, 2027 &middot; Kenya</p>
        <div class="hero__cta">
          <a class="btn btn--rsvp btn--rsvp-lg" href="#" data-rsvp-link>RSVP</a>
        </div>
        <p class="lead" style="margin-top: 1.2rem;"><strong>Please RSVP as soon as you can, deadline is November 30, 2026</strong></p>
      </div>
    </section>


  </main>

  <div id="site-footer"></div>
  <script src="js/main.js?v=3"></script>
</body>
</html>
